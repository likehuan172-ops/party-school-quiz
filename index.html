<script>
const questions=[{"n":1,"type":"单选","stem":"我们党执政兴国的第一要务是_____。","options":[{"key":"A","text":"创新"},{"key":"B","text":"改革"},{"key":"C","text":"发展"},{"key":"D","text":"开放"}],"answer":"C"},{"n":2,"type":"单选","stem":"党的最高理想和最终目标是_____。","options":[{"key":"A","text":"共同富裕"},{"key":"B","text":"让中国成为发达国家"},{"key":"C","text":"实现共产主义"},{"key":"D","text":"实现中国特色社会主义宏伟目标"}],"answer":"C"},{"n":3,"type":"单选","stem":"我们党必须坚持把_____作为一切工作的出发点和归宿。","options":[{"key":"A","text":"人民的根本利益"},{"key":"B","text":"党的群众基础"},{"key":"C","text":"党的执政能力"},{"key":"D","text":"工人阶级力量"}],"answer":"A"},{"n":4,"type":"单选","stem":"中国共产党是中国特色社会主义事业的_____。","options":[{"key":"A","text":"领导核心"},{"key":"B","text":"忠实代表"},{"key":"C","text":"先锋队"},{"key":"D","text":"中坚力量"}],"answer":"A"},{"n":5,"type":"单选","stem":"党的二十大报告指出，中国共产党是_____的党，也是为人类谋进步、为世界谋大同的党。","options":[{"key":"A","text":"为中华民族谋幸福、为中国人民谋复兴"},{"key":"B","text":"为中国人民谋幸福、为中华民族谋复兴"},{"key":"C","text":"为世界人民谋幸福、为国际社会谋复兴"},{"key":"D","text":"为国际社会谋幸福、为世界人民谋复兴"}],"answer":"B"},{"n":6,"type":"单选","stem":"党的二十大报告指出，“经过不懈努力，党找到了____这一跳出治乱兴衰历史周期率的____，自我净化、自我完善、自我革新、自我提高能力显著增强，管党治党宽松软状况得到根本扭转，风清气正的党内政治生态不断形成和发展，确保党永远不变质、不变色、不变味”。","options":[{"key":"A","text":"自我革命 第一个答案"},{"key":"B","text":"自我革命 第二个答案"},{"key":"C","text":"社会革命 第一个答案"},{"key":"D","text":"社会革命 第二个答案"}],"answer":"B"},{"n":7,"type":"单选","stem":"中国共产党第二十次全国代表大会关于《中国共产党章程（修正案）》的决议指出，学习党的历史，增强“四个意识”、坚定“四个自信”、做到“两个维护”，是广大党员应尽的义务。增强“四个意识”，即“_____”。","options":[{"key":"A","text":"担当意识、政治意识、核心意识、看齐意识"},{"key":"B","text":"政治意识、全局意识、责任意识、看齐意识"},{"key":"C","text":"政治意识、担当意识、责任意识、看齐意识"},{"key":"D","text":"政治意识、大局意识、核心意识、看齐意识"}],"answer":"D"},{"n":8,"type":"单选","stem":"中国共产党第二十次全国代表大会关于《中国共产党章程（修正案）》的决议指出，“两个确立”是党在新时代取得的重大政治成果。“两个确立”，即“_____”。","options":[{"key":"A","text":"确立习近平同志党中央的核心、全党的核心地位；确立党中央权威和集中统一领导"},{"key":"B","text":"确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位"},{"key":"C","text":"确立党中央权威和集中统一领导，确立习近平同志党中央的核心、全党的核心地位"},{"key":"D","text":"确立习近平新时代中国特色社会主义思想的指导地位，确立党中央权威和集中统一领导"}],"answer":"B"},{"n":9,"type":"单选","stem":"党的十九届六中全会通过的《中共中央关于党的百年奋斗重大成就和历史经验的决议》指出，以习近平同志为主要代表的中国共产党人，坚持马克思主义基本原理同______相结合、同______相结合，从新的实际出发，创立了习近平新时代中国特色社会主义思想。","options":[{"key":"A","text":"中国革命实际、中华优秀传统文化"},{"key":"B","text":"中国具体实际、中华优秀传统文化"},{"key":"C","text":"世界优秀文化、中国建设发展实际"},{"key":"D","text":"西方先进文化、中国建设发展实际"}],"answer":"B"},{"n":10,"type":"单选","stem":"_____是最根本的党内法规，是管党治党的总规矩？","options":[{"key":"A","text":"《中国共产党章程》"},{"key":"B","text":"《中国共产党廉洁自律准则》"},{"key":"C","text":"《中国共产党纪律处分条例》"},{"key":"D","text":"《宪法》"}],"answer":"A"},{"n":11,"type":"单选","stem":"党的十九届六中全会通过的《中共中央关于党的百年奋斗重大成就和历史经验的决议》中指出，习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，是_____的时代精华，实现了马克思主义中国化新的飞跃。","options":[{"key":"A","text":"中国精神和中华传统"},{"key":"B","text":"中国精神和中华模式"},{"key":"C","text":"中华文化和中国模式"},{"key":"D","text":"中华文化和中国精神"}],"answer":"D"},{"n":12,"type":"单选","stem":"_____不属于党的纪律处分工作应当遵循的原则。","options":[{"key":"A","text":"公平公正公开"},{"key":"B","text":"坚持党要管党、全面从严治党"},{"key":"C","text":"民主集中制"},{"key":"D","text":"惩前毖后、治病救人"}],"answer":"A"},{"n":13,"type":"单选","stem":"党的各级代表大会的代表受到______处分的，党组织应当终止其代表资格。","options":[{"key":"A","text":"党内警告以上"},{"key":"B","text":"党内严重警告以上"},{"key":"C","text":"留党察看以上"},{"key":"D","text":"撤销党内职务以上"}],"answer":"C"},{"n":14,"type":"单选","stem":"执行党纪处分决定的机关或者受处分党员所在单位，应当在_____将处分决定的执行情况向作出或者批准处分决定的机关报告。","options":[{"key":"A","text":"半个月内"},{"key":"B","text":"一个月内"},{"key":"C","text":"三个月内"},{"key":"D","text":"六个月内"}],"answer":"D"},{"n":15,"type":"单选","stem":"党员通过网络、广播、电视、报刊、传单、书籍等，或者利用讲座、论坛、报告会、座谈会等方式，公开发表坚持资产阶级自由化立场、反对四项基本原则，反对党的改革开放决策的文章、演说、宣言、声明等的，给予_______处分。","options":[{"key":"A","text":"警告"},{"key":"B","text":"严重警告"},{"key":"C","text":"留党察看"},{"key":"D","text":"开除党籍"}],"answer":"D"},{"n":16,"type":"单选","stem":"党的十九届六中全会通过的《中共中央关于党的百年奋斗重大成就和历史经验的决议》中指出，党确立习近平同志党中央的核心、全党的核心地位，确立______的指导地位，反映了全党全军全国各族人民共同心愿。","options":[{"key":"A","text":"科学发展观"},{"key":"B","text":"习近平新时代中国特色社会主义思想"},{"key":"C","text":"邓小平理论"},{"key":"D","text":"“三个代表”重要思想"}],"answer":"B"},{"n":17,"type":"单选","stem":"党的二十大提出了“三个务必”，要求全党同志务必不忘初心、牢记使命，务必谦虚谨慎、艰苦奋斗，务必______，坚定历史自信，增强历史主动。","options":[{"key":"A","text":"坚持原则、敢于斗争"},{"key":"B","text":"敢于斗争、善于斗争"},{"key":"C","text":"遵守纪律、善于斗争"},{"key":"D","text":"坚持原则、善于团结"}],"answer":"B"},{"n":18,"type":"单选","stem":"党员违反民主集中制原则，拒不执行或者擅自改变党组织作出的重大决定，或者违反议事规则，个人或者少数人决定重大问题，情节严重的，给予______处分。","options":[{"key":"A","text":"警告或者严重警告"},{"key":"B","text":"严重警告或者撤销党内职务"},{"key":"C","text":"撤销党内职务或者留党察看"},{"key":"D","text":"留党察看或者开除党籍"}],"answer":"C"},{"n":19,"type":"单选","stem":"十年来，我们经历了对党和人民事业具有重大现实意义和深远历史意义的三件大事：一是迎来中国共产党成立一百周年，二是______，三是完成脱贫攻坚、全面建成小康社会的历史任务，实现第一个百年奋斗目标。","options":[{"key":"A","text":"中国特色社会主义进入新时代"},{"key":"B","text":"社会主义现代化建设进入新时代"},{"key":"C","text":"中国特色社会主义进入新阶段"},{"key":"D","text":"全面改革开放进入新时代"}],"answer":"A"},{"n":20,"type":"单选","stem":"_______是实现中华民族伟大复兴的重要基础和关键一步。","options":[{"key":"A","text":"全面建成小康社会"},{"key":"B","text":"全面深化改革"},{"key":"C","text":"全面依法治国"},{"key":"D","text":"全面从严治党"}],"answer":"A"},{"n":21,"type":"单选","stem":"党的二十大报告指出：我们隆重庆祝中国共产党成立一百周年、中华人民共和国成立七十周年，制定_______历史决议，在全党开展党史学习教育。","options":[{"key":"A","text":"第一个历史决议"},{"key":"B","text":"第二个历史决议"},{"key":"C","text":"第三个历史决议"},{"key":"D","text":"第四个历史决议"}],"answer":"C"},{"n":22,"type":"单选","stem":"习近平总书记在庆祝中国共产党成立100周年大会上的讲话中指出，一百年来，中国共产党团结带领中国人民进行的一切奋斗、一切牺牲、一切创造，归结起来就是一个主题：________。","options":[{"key":"A","text":"实现中华民族伟大复兴"},{"key":"B","text":"实现人民解放"},{"key":"C","text":"实现民族独立"},{"key":"D","text":"全面实现社会主义现代化"}],"answer":"A"},{"n":23,"type":"单选","stem":"习近平总书记在庆祝中国共产党成立100周年大会上的讲话中指出，_____是中国共产党区别于其他政党的显著标志。","options":[{"key":"A","text":"坚持管党治党"},{"key":"B","text":"勇于自我革命"},{"key":"C","text":"坚持理论武装"},{"key":"D","text":"勇于自我牺牲"}],"answer":"B"},{"n":24,"type":"单选","stem":"党的二十大报告指出：开展了史无前例的反腐败斗争，以“得罪千百人、不负十四亿”的使命担当祛疴治乱，不敢腐、__________一体推进。","options":[{"key":"A","text":"不能腐、不想腐"},{"key":"B","text":"不便腐、不愿腐"},{"key":"C","text":"不能腐、不愿腐"},{"key":"D","text":"不能腐、不便腐"}],"answer":"A"},{"n":25,"type":"单选","stem":"新时代十年的伟大变革， let list=[...questions],pos=0,selected=new Set(),revealed=false,answered=false;
const WRONG_KEY='partySchoolQuizWrong_v1';
const PROGRESS_KEY='partySchoolQuizProgress_v1';
const CURRENT_KEY='partySchoolQuizCurrent_v1';
let progressBook={};
try{progressBook=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}')||{};}catch(e){progressBook={};}
let wrongBook={};
try{wrongBook=JSON.parse(localStorage.getItem(WRONG_KEY)||'{}')||{};}catch(e){wrongBook={};}
let wrongMode=false;
function saveWrong(){try{localStorage.setItem(WRONG_KEY,JSON.stringify(wrongBook));}catch(e){alert('浏览器暂时无法保存错题，请检查 Safari 网站数据设置。');}}
function saveProgress(){try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(progressBook));localStorage.setItem(CURRENT_KEY,String(list[pos]?.n||1));}catch(e){alert('浏览器无法保存做题记录，请检查 Safari 网站数据设置。');}}
function updateRecordUI(){const vals=Object.values(progressBook),done=vals.length,correct=vals.filter(x=>x.correct===true).length;const el=$('recordSummary');if(el)el.textContent='做题记录：已作答 '+done+' / 800 题 · 答对 '+correct+' 题 · 答错 '+(done-correct)+' 题。进度自动保存在当前 Safari。';}
function wrongCount(){return Object.keys(wrongBook).length;}
function refreshWrongUI(){ $('wrongMode').textContent='错题本（'+wrongCount()+'）'; const counts={};Object.values(wrongBook).forEach(x=>counts[x.type]=(counts[x.type]||0)+1);$('wrongSummary').textContent='错题共 '+wrongCount()+' 道：'+['单选','多选','判断','填空'].map(t=>t+' '+(counts[t]||0)).join(' · ')+(wrongMode?'。当前正在复习错题。':'。错题保存在当前 Safari 浏览器中。');$('wrongSummary').classList.toggle('show',wrongCount()>0||wrongMode);$('exitWrong').style.display=wrongMode?'inline-block':'none';$('wrongMode').style.display=wrongMode?'none':'inline-block';}
function addWrong(q){const old=wrongBook[q.n]||{n:q.n,type:q.type,stem:q.stem,answer:q.answer,wrongCount:0};old.wrongCount++;old.updatedAt=new Date().toISOString();wrongBook[q.n]=old;saveWrong();refreshWrongUI();}
function removeWrong(q){delete wrongBook[q.n];saveWrong();refreshWrongUI();applyFilter();}
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function answerText(q){return q.type==='多选'?q.answer.split('').join('、'):q.answer;}
function render(){
 if(!list.length){$('stem').textContent='没有找到符合条件的题目。';$('opts').innerHTML='';$('typeNo').textContent='';$('count').textContent='0 / 0';return;}
 const q=list[pos];selected.clear();revealed=false;answered=false;
 $('typeNo').textContent=q.type+' · 题号 '+q.n;$('count').textContent=(pos+1)+' / '+list.length;saveProgress();
 $('bar').style.width=((pos+1)/list.length*100)+'%';
 $('feedback').className='feedback';$('feedback').textContent='';
 $('prev').disabled=pos===0;$('next').disabled=pos===list.length-1;
 $('submit').style.display=q.type==='多选'?'inline-block':'none';$('submit').disabled=false;$('markWrong').style.display=q.type==='填空'?'inline-block':'none';$('mastered').style.display=wrongMode?'inline-block':'none';
 if(q.type==='填空'){
   let i=0,txt=esc(q.stem).replace(/_{2,}|＿{2,}/g,()=>`<button class="blank" data-i="${i++}">点击填空</button>`);
   $('stem').innerHTML=txt;
   $('opts').innerHTML='';
   $('stem').querySelectorAll('.blank').forEach(b=>b.addEventListener('click',()=>{b.textContent=q.answer;b.disabled=true;b.style.background='#edf9f0';b.style.borderColor='#48a56a';}));
   $('hint').textContent='点击下划线查看标准答案；如果没记住，可点“我不会，加入错题本”。';
 }else{
   $('stem').textContent=q.stem;
   $('opts').innerHTML=q.options.map(o=>`<button class="opt" data-key="${esc(o.key)}"><span class="key">${esc(o.key)}</span><span>${esc(o.text)}</span></button>`).join('');
   $('opts').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.key,b)));
   $('hint').textContent=q.type==='多选'?'可选择多个选项，选完后点击“提交答案”。': '点击选项后立即判断正误，并显示标准答案。';
   const rec=progressBook[q.n];
   if(rec){answered=true;const chosen=rec.chosen||'';if(q.type==='多选'){chosen.split('').filter(Boolean).forEach(k=>selected.add(k));$('opts').querySelectorAll('.opt').forEach(b=>{if(selected.has(b.dataset.key))b.classList.add('selected');if(q.answer.includes(b.dataset.key))b.classList.add('correct');if(selected.has(b.dataset.key)&&!q.answer.includes(b.dataset.key))b.classList.add('wrong');b.disabled=true;});$('submit').disabled=true;}else{$('opts').querySelectorAll('.opt').forEach(b=>{if(b.dataset.key===chosen)b.classList.add(rec.correct?'correct':'wrong');if(b.dataset.key===q.answer)b.classList.add('correct');b.disabled=true;});}
     const fb=$('feedback');fb.className='feedback '+(rec.correct?'good':'bad');fb.innerHTML=(rec.correct?'上次回答正确。':'上次回答错误。')+' 标准答案：<b>'+esc(answerText(q))+'</b>';
   }
 }
}
function showResult(ok,q,chosen){
 progressBook[q.n]={chosen:String(chosen||''),correct:!!ok,attempts:(progressBook[q.n]?.attempts||0)+1,updatedAt:new Date().toISOString()};saveProgress();updateRecordUI();
 if(!ok)addWrong(q);
 const f=$('feedback');f.className='feedback '+(ok?'good':'bad');
 f.innerHTML=(ok?'回答正确。':'回答错误。')+' 标准答案：<b>'+esc(answerText(q))+'</b>';
}
function choose(key,btn){
 const q=list[pos];if(answered&&q.type!=='多选')return;
 if(q.type==='多选'){if(selected.has(key))selected.delete(key);else selected.add(key);btn.classList.toggle('selected',selected.has(key));return;}
 answered=true;
 const ok=key===q.answer;btn.classList.add(ok?'correct':'wrong');
 $('opts').querySelectorAll('.opt').forEach(b=>{if(b.dataset.key===q.answer)b.classList.add('correct');b.disabled=true;});
 showResult(ok,q,key);
}
$('submit').onclick=()=>{const q=list[pos];if(q.type!=='多选')return;if(!selected.size){$('feedback').className='feedback bad';$('feedback').textContent='请先选择选项。';return;}
 answered=true;const chosen=[...selected].sort().join('');showResult(chosen===q.answer,q,chosen);
 $('opts').querySelectorAll('.opt').forEach(b=>{if(q.answer.includes(b.dataset.key))b.classList.add('correct');else if(selected.has(b.dataset.key))b.classList.add('wrong');b.disabled=true;});$('submit').disabled=true;};
$('prev').onclick=()=>{if(pos>0){pos--;render();$('submit').disabled=false;}};
$('next').onclick=()=>{if(pos<list.length-1){pos++;render();$('submit').disabled=false;}};
$('random').onclick=()=>{if(list.length){pos=Math.floor(Math.random()*list.length);render();}};
$('jumpBtn').onclick=()=>{const n=Number($('jumpNo').value);if(!Number.isInteger(n)||n<1||n>800){alert('请输入1到800之间的题号。');return;}wrongMode=false;refreshWrongUI();$('filter').value='全部';$('search').value='';list=[...questions];pos=list.findIndex(q=>q.n===n);if(pos>=0)render();};
$('jumpNo').addEventListener('keydown',e=>{if(e.key==='Enter')$('jumpBtn').click();});
$('markWrong').onclick=()=>{const q=list[pos];addWrong(q);$('feedback').className='feedback bad';$('feedback').textContent='已加入错题本。标准答案：'+answerText(q);};
$('mastered').onclick=()=>{const q=list[pos];removeWrong(q);};
$('wrongMode').onclick=()=>{wrongMode=true;refreshWrongUI();applyFilter();};
$('exitWrong').onclick=()=>{wrongMode=false;refreshWrongUI();applyFilter();};
function applyFilter(){const f=$('filter').value,s=$('search').value.trim().toLowerCase();list=questions.filter(q=>(!wrongMode||!!wrongBook[q.n])&&(f==='全部'||q.type===f)&&(!s||String(q.n).includes(s)||q.stem.toLowerCase().includes(s)));pos=0;$('submit').disabled=false;render();}
refreshWrongUI();
updateRecordUI();
try{const saved=Number(localStorage.getItem(CURRENT_KEY));if(saved>=1&&saved<=800){$('filter').value='全部';list=[...questions];pos=list.findIndex(q=>q.n===saved);}}catch(e){}
$('filter').onchange=applyFilter;$('search').oninput=applyFilter;
render();
</script></body></html>
