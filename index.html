备党员的预备期”。","options":[],"answer":["一年。"],"explanation":"参考答案：一年。","source":"《中国共产党章程》及党内法规"},{"id":91,"topic":"党的基础知识","type":"short","q":"简答：请简要说明““四个意识””。","options":[],"answer":["政治意识、大局意识、核心意识、看齐意识。"],"explanation":"参考答案：政治意识、大局意识、核心意识、看齐意识。","source":"《中国共产党章程》及党内法规"},{"id":92,"topic":"党的基础知识","type":"short","q":"简答：请简要说明“党的根本宗旨”。","options":[],"answer":["全心全意为人民服务。"],"explanation":"参考答案：全心全意为人民服务。","source":"《中国共产党章程》及党内法规"},{"id":93,"topic":"党的基础知识","type":"short","q":"简答：请简要说明“预备党员预备期的起算时间”。","options":[],"answer":["从支部大会通过其为预备党员之日算起。"],"explanation":"参考答案：从支部大会通过其为预备党员之日算起。","source":"《中国共产党章程》及党内法规"},{"id":94,"topic":"党的基础知识","type":"short","q":"简答：请简要说明““四个自信””。","options":[],"answer":["道路自信、理论自信、制度自信、文化自信。"],"explanation":"参考答案：道路自信、理论自信、制度自信、文化自信。","source":"《中国共产党章程》及党内法规"},{"id":95,"topic":"党的基础知识","type":"short","q":"简答：请简要说明“党的根本组织原则”。","options":[],"answer":["民主集中制。"],"explanation":"参考答案：民主集中制。","source":"《中国共产党章程》及党内法规"},{"id":96,"topic":"党的基础知识","type":"essay","q":"结合大学生身份，论述如何端正入党动机并在学习生活中发挥先锋模范作用。","options":[],"answer":["端正入党动机，核心是树立为共产主义事业奋斗、全心全意为人民服务的理想信念，而不是为了荣誉、就业或个人利益。应认真学习党的理论，主动接受党组织培养考察；在学习上勤奋求实、遵守学术规范，在工作中承担任务，在生活中联系同学、服务集体，以实际行动接受组织和群众检验。"],"explanation":"参考答案：端正入党动机，核心是树立为共产主义事业奋斗、全心全意为人民服务的理想信念，而不是为了荣誉、就业或个人利益。应认真学习党的理论，主动接受党组织培养考察；在学习上勤奋求实、遵守学术规范，在工作中承担任务，在生活中联系同学、服务集体，以实际行动接受组织和群众检验。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"《中国共产党章程》及党内法规"},{"id":97,"topic":"党的基础知识","type":"essay","q":"结合党的根本宗旨，论述青年学生如何践行全心全意为人民服务。","options":[],"answer":["全心全意为人民服务要求把人民利益放在首位。大学生应主动帮助同学、参与志愿服务和社会实践，关注基层群众需求；运用交通工程知识思考改善出行安全、效率与公平；坚持求真务实，把服务成效落实到具体行动。"],"explanation":"参考答案：全心全意为人民服务要求把人民利益放在首位。大学生应主动帮助同学、参与志愿服务和社会实践，关注基层群众需求；运用交通工程知识思考改善出行安全、效率与公平；坚持求真务实，把服务成效落实到具体行动。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"《中国共产党章程》及党内法规"},{"id":98,"topic":"党的基础知识","type":"essay","q":"结合民主集中制，论述个人发展与组织纪律之间的关系。","options":[],"answer":["民主集中制既强调充分发扬民主，又强调在民主基础上的正确集中。个人应充分表达意见、参与讨论，执行组织决定时遵守组织纪律；组织决策应听取意见、集体讨论。个人发展应融入集体目标，在遵守制度和履行职责中发挥主动性。"],"explanation":"参考答案：民主集中制既强调充分发扬民主，又强调在民主基础上的正确集中。个人应充分表达意见、参与讨论，执行组织决定时遵守组织纪律；组织决策应听取意见、集体讨论。个人发展应融入集体目标，在遵守制度和履行职责中发挥主动性。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"《中国共产党章程》及党内法规"},{"id":99,"topic":"党的基础知识","type":"essay","q":"结合党员义务与权利，论述如何做到权利义务相统一。","options":[],"answer":["党员义务是必须履行的责任，党员权利是参与党内事务、发挥作用的保障，二者相互联系。应认真履行党章规定的义务，严守纪律、完成任务、联系群众；同时正确行使知情、参与、监督等权利，按组织程序提出意见建议，不能只讲权利不履行义务。"],"explanation":"参考答案：党员义务是必须履行的责任，党员权利是参与党内事务、发挥作用的保障，二者相互联系。应认真履行党章规定的义务，严守纪律、完成任务、联系群众；同时正确行使知情、参与、监督等权利，按组织程序提出意见建议，不能只讲权利不履行义务。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"《中国共产党章程》及党内法规"},{"id":100,"topic":"党的基础知识","type":"essay","q":"结合新时代青年使命，论述如何坚定理想信念并落实实际行动。","options":[],"answer":["新时代青年应坚定理想信念，把理想落实到专业学习、科研训练、社会实践和志愿服务中，树立正确价值观，提升专业能力；面对困难坚持奋斗，遵守纪律、诚实守信，把个人理想融入国家发展和人民需要。"],"explanation":"参考答案：新时代青年应坚定理想信念，把理想落实到专业学习、科研训练、社会实践和志愿服务中，树立正确价值观，提升专业能力；面对困难坚持奋斗，遵守纪律、诚实守信，把个人理想融入国家发展和人民需要。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"《中国共产党章程》及党内法规"},{"id":101,"topic":"“十五五”规划","type":"single","q":"根据本专题资料，关于““十五五”规划期”的正确表述是？","options":["“十五五”规划期为2025年至2029年。","“十五五”时期以低质量粗放增长为主题。","“十五五”时期发展的根本动力是扩大行政审批。","2026年至2030年。"],"answer":["D"],"explanation":"2026年至2030年。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":102,"topic":"“十五五”规划","type":"single","q":"根据本专题资料，关于““十五五”时期要完整准确全面贯彻”的正确表述是？","options":["规划纲要提出放弃数字中国建设。","新发展理念。","“十五五”时期以低质量粗放增长为主题。","“十五五”时期发展的根本动力是扩大行政审批。"],"answer":["B"],"explanation":"新发展理念。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":103,"topic":"“十五五”规划","type":"single","q":"根据本专题资料，关于“绿色发展要求”的正确表述是？","options":["“十五五”时期发展的根本动力是扩大行政审批。","规划纲要提出放弃数字中国建设。","规划时期不涉及国家安全和绿色发展。","加快经济社会发展全面绿色转型，建设美丽中国。"],"answer":["D"],"explanation":"加快经济社会发展全面绿色转型，建设美丽中国。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":104,"topic":"“十五五”规划","type":"single","q":"根据本专题资料，关于““十五五”时期的阶段定位”的正确表述是？","options":["“十五五”规划期为2025年至2029年。","基本实现社会主义现代化夯实基础、全面发力的关键时期。","规划纲要提出放弃数字中国建设。","规划时期不涉及国家 要》"},{"id":179,"topic":"“十五五”规划","type":"short","q":"简答：请简要说明““十五五”时期要完整准确全面贯彻”。","options":[],"answer":["新发展理念。"],"explanation":"参考答案：新发展理念。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":180,"topic":"“十五五”规划","type":"short","q":"简答：请简要说明“绿色发展要求”。","options":[],"answer":["加快经济社会发展全面绿色转型，建设美丽中国。"],"explanation":"参考答案：加快经济社会发展全面绿色转型，建设美丽中国。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":181,"topic":"“十五五”规划","type":"short","q":"简答：请简要说明““十五五”时期的阶段定位”。","options":[],"answer":["基本实现社会主义现代化夯实基础、全面发力的关键时期。"],"explanation":"参考答案：基本实现社会主义现代化夯实基础、全面发力的关键时期。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":182,"topic":"“十五五”规划","type":"short","q":"简答：请简要说明““十五五”时期要加快构建”。","options":[],"answer":["新发展格局。"],"explanation":"参考答案：新发展格局。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":183,"topic":"“十五五”规划","type":"short","q":"简答：请简要说明“民生工作的根本取向”。","options":[],"answer":["坚持以人民为中心，不断增进民生福祉。"],"explanation":"参考答案：坚持以人民为中心，不断增进民生福祉。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":184,"topic":"“十五五”规划","type":"short","q":"简答：请简要说明““十五五”时期经济社会发展的主题”。","options":[],"answer":["推动高质量发展。"],"explanation":"参考答案：推动高质量发展。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":185,"topic":"“十五五”规划","type":"short","q":"简答：请简要说明“现代化产业体系建设的重点”。","options":[],"answer":["巩固壮大实体经济根基。"],"explanation":"参考答案：巩固壮大实体经济根基。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":186,"topic":"“十五五”规划","type":"short","q":"简答：请简要说明“区域发展要求”。","options":[],"answer":["促进区域协调发展，优化国土空间发展格局。"],"explanation":"参考答案：促进区域协调发展，优化国土空间发展格局。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":187,"topic":"“十五五”规划","type":"essay","q":"结合交通工程专业，论述“十五五”时期发展新质生产力与交通强国建设的联系。","options":[],"answer":["“十五五”时期发展新质生产力强调科技创新引领和现代化产业体系建设。交通强国建设需要智能交通、智慧公路、车路协同、绿色低碳运输等创新支撑。交通工程专业学生应夯实交通流理论、规划设计、数据分析和人工智能基础，参与真实场景研究，推动技术服务安全、效率、绿色与公平出行。"],"explanation":"参考答案：“十五五”时期发展新质生产力强调科技创新引领和现代化产业体系建设。交通强国建设需要智能交通、智慧公路、车路协同、绿色低碳运输等创新支撑。交通工程专业学生应夯实交通流理论、规划设计、数据分析和人工智能基础，参与真实场景研究，推动技术服务安全、效率、绿色与公平出行。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":188,"topic":"“十五五”规划","type":"essay","q":"围绕高质量发展，论述大学生如何把个人成长融入国家现代化建设。","options":[],"answer":["高质量发展是全面建设社会主义现代化国家的首要任务。大学生应把个人成长与国家需求结合，明确专业方向，夯实知识和实践能力；增强创新意识与协作能力，参与科研、实习和社会实践；树立正确就业观，到国家需要的领域建功立业。"],"explanation":"参考答案：高质量发展是全面建设社会主义现代化国家的首要任务。大学生应把个人成长与国家需求结合，明确专业方向，夯实知识和实践能力；增强创新意识与协作能力，参与科研、实习和社会实践；树立正确就业观，到国家需要的领域建功立业。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":189,"topic":"“十五五”规划","type":"essay","q":"结合数字中国建设，论述人工智能与数据要素如何推动产业转型。","options":[],"answer":["人工智能提升生产决策、预测调度和自动化水平，数据要素通过汇聚、流通、治理和分析促进资源优化配置。推动产业转型需要数字基础设施、数据标准和安全治理，促进技术与实体经济融合；同时重视数据质量、隐私保护、算法公平和人才培养。"],"explanation":"参考答案：人工智能提升生产决策、预测调度和自动化水平，数据要素通过汇聚、流通、治理和分析促进资源优化配置。推动产业转型需要数字基础设施、数据标准和安全治理，促进技术与实体经济融合；同时重视数据质量、隐私保护、算法公平和人才培养。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":190,"topic":"“十五五”规划","type":"essay","q":"围绕绿色低碳发展，论述交通运输领域的转型路径与青年责任。","options":[],"answer":["交通运输绿色低碳转型可从优化运输结构、发展公共交通和多式联运、推广新能源交通工具、提升能效、建设绿色交通基础设施等方面推进。交通工程专业学生应学习交通规划、能源与环境评价、智能交通等知识，参与低碳出行研究和实践。"],"explanation":"参考答案：交通运输绿色低碳转型可从优化运输结构、发展公共交通和多式联运、推广新能源交通工具、提升能效、建设绿色交通基础设施等方面推进。交通工程专业学生应学习交通规划、能源与环境评价、智能交通等知识，参与低碳出行研究和实践。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》"},{"id":191,"topic":"二十届五中全会","type":"single","q":"根据本专题资料，关于“二十届五中全会召开时间”的正确表述是？","options":["全会审议通过了第十四个五年规划纲要。","2026年10月26日至29日。","二十届五中全会于2025年10月在上海召开。","全会由全国人大常委会主持。"],"answer":["B"],"explanation":"2026年10月26日至29日。","source":"中国共产党第二十届中央委员会第五次全体会议公报"},{"id":192,"topic":"二十届五中全会","type":"single","q":"根据本专题资料，关于“全会对新时代全面从严治党成就的评价”的正确表述是？","options":["全会由全国人大常委会主持。","全会审议通过了第十四个五年规划纲要。","全会主题是扩大高校招生规模。","高度评价新时代全面从严治党取得的伟大成就。"],"answer":["D"],"explanation":"高度评价新时代全面从严治党取得的伟大成就。","source":"中国共产党第二十届中央委员会第五次全体会议公报"},{"id":193,"topic":"二十届五中全会","type":"single","q":"根据本专题资料，关于“全会公报通过日期”的正确表述是？","options":["全会于2026年11月26日至29日召开。","2026年10月29日。","全会审议通过了第十四 展战略明确了学校发展目标、战略和重点工程。交通学院学生可立足交通运输工程学科特色，夯实专业基础，参与智慧交通、绿色交通、交通安全等科研实践；融入科教融合、产教协同平台，提升创新能力，以专业所长服务学校高质量发展。"],"explanation":"参考答案：学校“1364”发展战略明确了学校发展目标、战略和重点工程。交通学院学生可立足交通运输工程学科特色，夯实专业基础，参与智慧交通、绿色交通、交通安全等科研实践；融入科教融合、产教协同平台，提升创新能力，以专业所长服务学校高质量发展。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"长沙理工大学第五次党代会报告决议"},{"id":328,"topic":"长沙理工大学第五次党代会","type":"essay","q":"围绕“铺路石”精神，论述新时代长理青年如何担当工程报国使命。","options":[],"answer":["“铺路石”精神体现脚踏实地、甘于奉献、服务国家建设的价值追求。长理青年应把个人理想融入交通强国和国家基础设施建设需要，扎实学习专业知识，提升工程实践与创新能力；在基层实践中了解需求，恪守工程伦理和安全底线，以实干践行工程报国使命。"],"explanation":"参考答案：“铺路石”精神体现脚踏实地、甘于奉献、服务国家建设的价值追求。长理青年应把个人理想融入交通强国和国家基础设施建设需要，扎实学习专业知识，提升工程实践与创新能力；在基层实践中了解需求，恪守工程伦理和安全底线，以实干践行工程报国使命。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"长沙理工大学第五次党代会报告决议"},{"id":329,"topic":"长沙理工大学第五次党代会","type":"essay","q":"结合三大战略，论述交通工程专业学生的成长方向。","options":[],"answer":["三大战略从学科引领、科技创新和未来发展等方面推动学校建设。交通工程专业学生应夯实交通规划、设计、控制与数据分析基础；关注智能网联、自动驾驶、交通大数据和绿色交通；参与科研项目、学科竞赛和产学研实践，提升跨学科创新能力。"],"explanation":"参考答案：三大战略从学科引领、科技创新和未来发展等方面推动学校建设。交通工程专业学生应夯实交通规划、设计、控制与数据分析基础；关注智能网联、自动驾驶、交通大数据和绿色交通；参与科研项目、学科竞赛和产学研实践，提升跨学科创新能力。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"长沙理工大学第五次党代会报告决议"},{"id":330,"topic":"长沙理工大学第五次党代会","type":"essay","q":"论述如何理解学校第五次党代会提出的立德树人根本任务。","options":[],"answer":["立德树人是教育的根本任务，要求把思想政治教育贯穿人才培养全过程，促进学生全面发展。学校应将价值塑造、知识传授和能力培养相结合。学生应树立正确理想信念，遵守学术规范，提升专业能力与社会责任感，努力成长为时代新人。"],"explanation":"参考答案：立德树人是教育的根本任务，要求把思想政治教育贯穿人才培养全过程，促进学生全面发展。学校应将价值塑造、知识传授和能力培养相结合。学生应树立正确理想信念，遵守学术规范，提升专业能力与社会责任感，努力成长为时代新人。 评分要点：紧扣题意；概念和政策表述准确；分析有层次；结合大学生及专业实际提出具体行动；逻辑清晰、表达完整。","source":"长沙理工大学第五次党代会报告决议"},{"id":331,"topic":"《本科学生手册（2024版）》","type":"single","q":"根据本专题资料，关于“《本科学生手册（2024版）》的主要组成”的正确表述是？","options":["机动车校内道路限速为60公里/小时。","学校章程、上级有关文件、学校教育与管理三大部分。","学生证补办时间为每周五上午。","校园交通安全管理主要职能部门是教务处。"],"answer":["B"],"explanation":"学校章程、上级有关文件、学校教育与管理三大部分。","source":"《本科学生手册（2024版）》简介及校园交通安全管理办法"},{"id":332,"topic":"《本科学生手册（2024版）》","type":"single","q":"根据本专题资料，关于“学生享有的教育权利”的 function feedback(q,a){const el=$("feedback");if(q.type==="short"||q.type==="essay"){el.className="feedback";el.textContent=q.explanation;return}let text=q.type==="fill"?"参考答案："+q.answer[0]:"正确答案："+q.answer.join("、");el.className="feedback "+(a.correct===true?"good":a.correct===false?"bad":"");el.textContent=(a.correct===true?"回答正确。":a.correct===false?"回答错误。":"已提交。")+text+" "+q.explanation}
function render(){list=getList();$("feedback").textContent="";if(!list.length){$("meta").textContent="没有符合条件的题目";$("counter").textContent="0 / 0";$("question").textContent="请调整筛选条件。";$("options").innerHTML="";$("hint").textContent="";$("source").textContent="";return}state.index=Math.max(0,Math.min(state.index,list.length-1));const q=list[state.index],a=state.answers[q.id]||{};$("meta").textContent=names[q.type]+" · 题号 "+q.id+" · "+q.topic;$("counter").textContent=(state.index+1)+" / "+list.length;$("question").textContent=q.q;$("options").innerHTML="";$("source").textContent="资料依据："+q.source;
if(["single","multi","judge"].includes(q.type)){q.options.forEach((v,i)=>{const k=String.fromCharCode(65+i),b=document.createElement("button");b.className="option"+(a.selected&&a.selected.includes(k)?" selected":"");const l=document.createElement("span"),t=document.createElement("span");l.className="letter";l.textContent=k;t.textContent=v;b.append(l,t);b.onclick=()=>{let x=state.answers[q.id]||{selected:[]};if(x.submitted)return;if(q.type==="single"||q.type==="judge")x.selected=[k];else x.selected=x.selected.includes(k)?x.selected.filter(z=>z!==k):x.selected.concat(k);state.answers[q.id]=x;save();render()};$("options").appendChild(b)})}
else if(q.type==="fill"){const x=document.createElement("input");x.className="answerInput";x.placeholder="输入答案";x.value=a.text||"";x.oninput=()=>{state.answers[q.id]=Object.assign(state.answers[q.id]||{}, {text:x.value});save()};$("options").appendChild(x)}
else{const box=document.createElement("div");box.className="essaybox";box.innerHTML='<div class="small">先自行作答，再点击“查看参考答案”。</div><textarea placeholder="在这里组织答案……"></textarea>';box.querySelector("textarea").value=a.text||"";box.querySelector("textarea").oninput=e=>{state.answers[q.id]=Object.assign(state.answers[q.id]||{}, {text:e.target.value});save()};$("options").appendChild(box)}
$("submit").style.display="inline-block";$("submit").textContent=(q.type==="short"||q.type==="essay")?"查看参考答案":"提交答案";$("hint").textContent=q.type==="multi"?"可选择多个选项，选完后提交。":q.type==="short"||q.type==="essay"?"简答、论述题采用参考答案和评分要点自我对照。":q.type==="fill"?"填写核心关键词后提交；支持答案关键词匹配。":"选择选项后提交判定。";
if(a.submitted||a.revealed)feedback(q,a);$("prev").disabled=state.index===0;$("next").disabled=state.index===list.length-1;status()}
$("submit").onclick=()=>{const q=list[state.index];if(!q)return;let a=state.answers[q.id]||{};if(q.type==="short"||q.type==="essay"){a.revealed=true;state.answers[q.id]=a;save();render();return}if(q.type==="fill"){const norm=s=>String(s||"").toLowerCase().replace(/[，。；、：:；;！!？?、“”‘’（）()\\s]/g,"");const typed=norm(a.text),gold=norm(q.answer[0]);a.correct=typed.length>0&&typed===gold}else{if(!a.selected||!a.selected.length){alert("请先选择答案");return}a.correct=JSON.stringify(a.selected.slice().sort())===JSON.stringify(q.answer.slice().sort())}a.submitted=true;state.answers[q.id]=a;if(a.correct)state.wrong=state.wrong.filter(x=>x!==q.id);else if(!state.wrong.includes(q.id))state.wrong.push(q.id);save();render()};
$("prev").onclick=()=>{state.index--;render()};$("next").onclick=()=>{state.index++;render()};$("topic").onchange=e=>{state.filterTopic=e.target.value;state.index=0;render()};$("type").onchange=e=>{state.filterType=e.target.value;state.index=0;render()};$("search").oninput=e=>{state.search=e.target.value;state.index=0;render()};$("jumpBtn").onclick=()=>{const n=Number($("jump").value),i=list.findIndex(q=>q.id===n);if(i<0){alert("当前筛选范围内找不到该题号");return}state.index=i;render()};$("random").onclick=()=>{if(list.length){state.index=Math.floor(Math.random()*list.length);render()}};$("wrongBtn").onclick=()=>{state.wrongMode=!state.wrongMode;state.index=0;render()};$("reset").onclick=()=>{if(confirm("确定清空400题新版的答题记录和错题本？")){state.answers={};state.wrong=[];save();render()}};render();
</script></body></html>
